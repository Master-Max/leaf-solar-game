name: Deploy to GitHub Pages

on:
  push:
    # The repository was created empty, so GitHub made the first pushed branch
    # the default. Both are listed until this settles on one.
    branches: [main, claude/keen-faraday-ln41m1]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The game is plain static files, so the repository root is the site.
      # enablement turns Pages on for the repository on the first run, so the
      # deploy does not need anyone to visit Settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
