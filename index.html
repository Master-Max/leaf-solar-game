<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26C4 12 14 4 28 4c0 14-8 24-22 22z' fill='%237fbf3f'/%3E%3Cpath d='M4 28L26 6' stroke='%23f5ffdc' stroke-width='2'/%3E%3C/svg%3E">
<title>Leaf on the Light</title>
<style>
  :root {
    --ink: #f4f1e4;
    --ink-dim: #b9b49c;
    --gold: #ffd978;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1020;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- in-run HUD ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 22px; align-items: baseline;
    padding: 14px 18px 34px;
    pointer-events: none;
    /* The sky behind the HUD is often near-white, so carry a scrim along. */
    background: linear-gradient(rgba(10,18,34,.42), rgba(10,18,34,0));
    text-shadow: 0 1px 4px rgba(6,12,24,.85), 0 0 14px rgba(6,12,24,.5);
    opacity: 0; transition: opacity .35s ease;
  }
  #hud.on { opacity: 1; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat b { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #ded9c4; }
  .stat.gold b { color: var(--gold); }
  #hud .spacer { flex: 1; }
  #mute { font-size: 11px; letter-spacing: .1em; color: #ded9c4; text-transform: uppercase; }

  /* ---- overlays ---- */
  #overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(8,12,26,.55), rgba(5,8,18,.88));
    backdrop-filter: blur(2px);
    padding: 24px;
  }
  #overlay[hidden] { display: none; }
  .card {
    width: min(560px, 100%);
    text-align: center;
    animation: rise .5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card h1 {
    margin: 0 0 6px; font-size: clamp(30px, 7vw, 50px); font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(100deg, #cfe98a, var(--gold) 55%, #ffb46b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card .tag { margin: 0 0 26px; color: var(--ink-dim); font-size: 14px; letter-spacing: .04em; }
  .keys {
    display: grid; grid-template-columns: auto 1fr; gap: 9px 16px;
    max-width: 380px; margin: 0 auto 28px; text-align: left;
    font-size: 13px; color: var(--ink-dim);
  }
  kbd {
    display: inline-block; min-width: 24px; padding: 3px 7px; margin-right: 3px;
    border: 1px solid rgba(244,241,228,.22); border-bottom-width: 2px; border-radius: 5px;
    background: rgba(244,241,228,.07); color: var(--ink);
    font: inherit; font-size: 11px; text-align: center;
  }
  .cta {
    display: inline-block; padding: 13px 30px; border-radius: 999px; border: 0;
    background: linear-gradient(100deg, #9ed14f, var(--gold));
    color: #14200c; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .02em;
    cursor: pointer; box-shadow: 0 8px 26px rgba(255,200,90,.22);
  }
  .cta:hover { filter: brightness(1.07); }
  .cta:active { transform: translateY(1px); }
  .scores { display: flex; justify-content: center; gap: 40px; margin: 0 0 26px; }
  .scores .stat { align-items: center; }
  .scores .stat b { font-size: 40px; }
  .note { margin-top: 20px; font-size: 12px; color: rgba(185,180,156,.7); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="stat"><b id="hud-dist">0</b><span>metres</span></div>
      <div class="stat gold"><b id="hud-energy">0</b><span>light</span></div>
      <div class="stat"><b id="hud-alt">0</b><span>altitude</span></div>
      <div class="spacer"></div>
      <div id="mute">M · sound on</div>
    </div>

    <div id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
